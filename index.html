<body>
<canvas id="scene"></canvas>
    <div id="hud">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>

          <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></symbol>
          <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></symbol>
          <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></symbol>
          <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .4-8.6 6 6 0 0 0-11.4 1.6A3.6 3.6 0 0 0 7 18.5z"/></symbol>
          <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 14.5h10.2a4.3 4.3 0 0 0 .4-8.6 6 6 0 0 0-11.4 1.6A3.6 3.6 0 0 0 7 14.5z"/><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"/></symbol>
          <symbol id="i-thunder" viewBox="0 0 24 24"><path d="M7 14.5h10.2a4.3 4.3 0 0 0 .4-8.6 6 6 0 0 0-11.4 1.6A3.6 3.6 0 0 0 7 14.5z"/><path d="M12.8 13.5l-2.3 3.8h3l-2.2 3.9" /></symbol>
          <symbol id="i-fog" viewBox="0 0 24 24"><path d="M6 10.5h10.5a3.6 3.6 0 0 0 .3-7.1A5 5 0 0 0 7.3 4.8 3 3 0 0 0 6 10.5z"/><path d="M3.5 14h13M6.5 17.5h14M3.5 21h11"/></symbol>

          <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-7h6l3 7M9.5 9l3 7h-7M15.5 9l-1-2.5h-2.5M14 6.5h3"/></symbol>

      </svg>

      <header class="title">
        <h1>Resort Island</h1>
        <p class="caption"><span id="place">Drag to look around · scroll to zoom</span></p>
        <p id="now-playing" class="now-playing" hidden aria-live="polite"><svg class="icon"><use href="#i-note"/></svg><span></span></p>
      </header>

      <div id="weather-panel" class="weather-panel" role="group" aria-labelledby="weather-heading" inert>
        <div class="panel-head">
          <h2 id="weather-heading">Weather</h2>
          <span id="weather-status" class="status" aria-live="polite"></span>
        </div>
        <div class="weather-grid">
          <button class="wx" type="button" data-weather="sunny" aria-pressed="true"><svg class="icon"><use href="#i-sunny-wx"/></svg><span>Sunny</span><svg class="check"><use href="#i-check"/></svg></button>
          <button class="wx" type="button" data-weather="cloudy" aria-pressed="false"><svg class="icon"><use href="#i-cloud"/></svg><span>Cloudy</span><svg class="check"><use href="#i-check"/></svg></button>
          <button class="wx" type="button" data-weather="rain" aria-pressed="false"><svg class="icon"><use href="#i-rain"/></svg><span>Rain</span><svg class="check"><use href="#i-check"/></svg></button>
          <button class="wx" type="button" data-weather="thunder" aria-pressed="false"><svg class="icon"><use href="#i-thunder"/></svg><span>Thunderstorm</span><svg class="check"><use href="#i-check"/></svg></button>
          <button class="wx" type="button" data-weather="fog" aria-pressed="false"><svg class="icon"><use href="#i-fog"/></svg><span>Fog</span><svg class="check"><use href="#i-check"/></svg></button>
          <button class="wx" type="button" data-weather="tropical" aria-pressed="false"><svg class="icon"><use href="#i-storm"/></svg><span>Tropical storm</span><svg class="check"><use href="#i-check"/></svg></button>
        </div>
      </div>

      <button id="launch" class="pill launch-btn" type="button"><svg class="icon"><use href="#i-rocket"/></svg><span class="label">Launch Falcon 9</span></button>
      <div id="speedo" class="speedo" hidden aria-live="off">
